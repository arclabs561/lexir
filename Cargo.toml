[package]
name = "lexir"
version = "0.1.5"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["Arc <attobop@gmail.com>"]
description = "Lexical IR (BM25/TF-IDF) on top of postings lists."
repository = "https://github.com/arclabs561/lexir"
homepage = "https://github.com/arclabs561/lexir"
documentation = "https://github.com/arclabs561/lexir#readme"
readme = "README.md"
publish = true
keywords = ["search", "bm25", "tf-idf"]
categories = ["text-processing", "algorithms"]

[workspace]

[dependencies]
postings = "0.1.8"
thiserror = "2.0"
rankfns = "0.1.3"
gramdex = { version = "0.3.4", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
durability = { version = "0.6.12", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
postcard = { version = "1.0", optional = true, features = ["alloc"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
proptest = "1.5"
criterion = "0.5"

[features]
default = ["persistence"]
fuzzy = ["dep:gramdex"]
persistence = ["dep:durability", "dep:serde", "postings/persistence"]
recordlog = ["persistence", "dep:postcard"]
cli = ["dep:clap", "recordlog"]

[[bin]]
name = "lexir"
test = false
path = "src/bin/lexir.rs"

[[bench]]
name = "retrieve"
harness = false
