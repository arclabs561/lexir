name: Retrieval benchmarks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/bench.yml'
      - 'benches/cranfield/**'
      - 'examples/cranfield_search.rs'
permissions:
  contents: read
jobs:
  cranfield:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Build BM25 search and record runner configuration
        run: |
          mkdir -p results
          lscpu > results/cpu.txt
          rustc -Vv > results/rust.txt
          cargo build --release --example cranfield_search
          cp Cargo.lock results/
      - name: Install CPU encoder
        run: |
          python3 -m venv bench-env
          bench-env/bin/pip install numpy==2.3.5 onnxruntime==1.32.0 tokenizers==0.23.3
          bench-env/bin/pip freeze > results/python.txt
      - name: Prepare pinned collection and model
        run: |
          mkdir -p raw model
          curl -fLsS --retry 3 https://ir.dcs.gla.ac.uk/resources/test_collections/cran/cran.tar.gz -o cran.tar.gz
          echo '8c48a8412e4a7e6e0dd5af99c959f8d75fdf88135602adc1a56aa22770652d64  cran.tar.gz' | sha256sum -c -
          tar xzf cran.tar.gz -C raw
          python3 benches/cranfield/prepare.py raw data
          base=https://huggingface.co/Xenova/bge-small-en-v1.5/resolve/ea104dacec62c0de699686887e3f920caeb4f3e3
          curl -fLsS --retry 3 "$base/tokenizer.json" -o model/tokenizer.json
          curl -fLsS --retry 3 "$base/onnx/model_quantized.onnx" -o model/model_quantized.onnx
          sha256sum -c benches/cranfield/model-checksums.txt
      - name: Replay 225 queries at one, two and four clients
        run: |
          bench-env/bin/python benches/cranfield/load.py data model target/release/examples/cranfield_search results
          cat results/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cranfield-load
          path: results/
          if-no-files-found: error
